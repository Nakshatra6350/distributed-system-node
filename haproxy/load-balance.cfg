defaults
    mode http
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

frontend inbound
    bind *:3000
    default_backend web-api
    stats enable
    stats uri /admin?stats

backend web-api
    option httpchk GET /health
    server web-api-1 host.docker.internal:3001 check inter 2s fall 3 rise 2
    server web-api-2 host.docker.internal:3002 check inter 2s fall 3 rise 2

